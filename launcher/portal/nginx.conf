server {
    listen 4242;
    root /portal/www;
    index index.html;

    # La page et ses donnees changent avec le depot : jamais de cache, sinon une modification
    # ne se voit qu'apres un vidage manuel du navigateur
    location / { add_header Cache-Control "no-store"; }

    # les sujets des projets (PDF), lus directement dans le depot
    location /projects/ { alias /portal/projects/; autoindex off; }

    # L'ecran virtuel des projets MiniLibX, servi par le portail : le conteneur d'ecran n'est
    # publie nulle part, il n'est joignable que par le reseau Docker commun.
    location /screen/ {
        proxy_pass http://42-cursus-gui:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    # Le pont souris/clavier du mode jeu (websocket vers XTest)
    location /input {
        proxy_pass http://42-cursus-gui:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    # Terminal web : meme origine que la page, ttyd verifie l'origine des websockets (-O).
    # Host doit garder le port, sinon l'origine ne correspond pas et ttyd refuse la connexion.
    location /term/ {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }
}
