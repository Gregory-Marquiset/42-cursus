server {
    listen 4242;
    root /portal/www;
    index index.html;

    # Donnees du graph et des projets : jamais en cache, elles changent avec le depot
    location ~ \.json$ { add_header Cache-Control "no-store"; }

    # Terminal web : meme origine que la page, ttyd verifie l'origine des websockets (-O)
    location /term/ {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }
}
